<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KasKelas — Uang Kas Digital</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fa2d48">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* === THEME === */
:root{
  --bg:#fff;--sf:#f5f5f7;--tx:#1d1d1f;--mu:#86868b;--bd:#e5e5ea;
  --pri:#fa2d48;--pri-l:#ff5e73;--grad:linear-gradient(135deg,#fa2d48 0%,#ff5e73 100%);
  --pt:#fff;--ok:#34c759;--er:#ff3b30;--okb:#e8f8ee;--erb:#ffebea;
  --sh:0 4px 12px rgba(0,0,0,.04);--sh-lg:0 10px 30px rgba(0,0,0,.08);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-role="s"]{--pri:#007aff;--pri-l:#5ac8fa;--grad:linear-gradient(135deg,#007aff 0%,#5ac8fa 100%)}
html[data-role="w"]{--pri:#af52de;--pri-l:#da8aff;--grad:linear-gradient(135deg,#af52de 0%,#da8aff 100%)}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--sf:#1c1c1e;--tx:#f2f2f7;--mu:#8e8e93;--bd:#38383a;
    --okb:rgba(52,199,89,.15);--erb:rgba(255,59,48,.15);
    --sh:0 4px 12px rgba(0,0,0,.2);--sh-lg:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;
  }
}
html[data-theme="dark"]{
  --bg:#000;--sf:#1c1c1e;--tx:#f2f2f7;--mu:#8e8e93;--bd:#38383a;
  --okb:rgba(52,199,89,.15);--erb:rgba(255,59,48,.15);
  --sh:0 4px 12px rgba(0,0,0,.2);--sh-lg:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;transition:background-color .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.03em;font-weight:700}
h3{font-size:20px}
small,.mu{color:var(--mu);font-weight:400}small{font-size:13px}
#root{max-width:640px;margin:0 auto;padding:0 20px 100px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px;background:var(--bg);margin:0 -20px;border-bottom:1px solid var(--bd)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand b{display:block;line-height:1.2;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:12px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ic{width:22px;height:22px;stroke-width:2}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--bd)}
.nav>div{display:flex;gap:4px;width:100%;max-width:480px}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:500;color:var(--mu);padding:8px 2px;border-radius:12px;cursor:pointer;transition:.2s}
.nav button.on{color:var(--pri)}
.view>*{margin-bottom:24px}
.an>*{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px) scale(.98)}}
.card{background:var(--sf);border-radius:20px;padding:20px;border:1px solid transparent;transition:.2s}
.rc{text-align:left;cursor:pointer;display:grid;gap:4px;color:var(--tx);transition:.2s;font:inherit}
.rc:active{transform:scale(.98)}
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:28px;position:relative;overflow:hidden;box-shadow:var(--sh-lg)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:30px solid rgba(255,255,255,.1)}
.hero small{color:rgba(255,255,255,.8);font-weight:500;text-transform:uppercase;letter-spacing:1px;font-size:11px}
.big{font-size:clamp(36px,10vw,48px);font-weight:700;margin:4px 0 8px;letter-spacing:-1.5px}
.btn{border:0;background:var(--pri);color:var(--pt);padding:14px 24px;border-radius:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;font-size:15px}
.btn:active{transform:scale(.96);opacity:.8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--grad);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn.ghost{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:var(--er);color:#fff}
.btn.sm{padding:8px 16px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.ib{border:0;background:var(--sf);color:var(--mu);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.ib:active{transform:scale(.9)}
.lnk{background:none;border:0;color:var(--pri);cursor:pointer;font-weight:500;padding:10px 0;display:inline-block;font-size:14px}
.f{display:grid;gap:8px;margin-bottom:20px}
.f span{font-size:13px;font-weight:500;color:var(--tx)}
input,select,textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);outline:0;transition:.2s;font-size:15px;font-weight:400;color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--pri);background:var(--sf);box-shadow:0 0 0 3px var(--pri-l)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;background:var(--bg);color:var(--tx);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.r{background:var(--erb);color:var(--er)}
.chip.g{background:var(--bd);color:var(--tx)}
.chip.p{background:#fff3cd;color:#8a6d00}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.p{background:rgba(255,204,0,.18);color:#ffcc00}}
html[data-theme="dark"] .chip.p{background:rgba(255,204,0,.18);color:#ffcc00}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--er);font-weight:600}
.row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0;padding-bottom:0}
.m{flex:1;min-width:0}.m b{display:block;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:500;margin-bottom:2px}
.rowh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.gw{overflow-x:auto;border-radius:16px;background:var(--sf);padding:4px}
.gw table{border-collapse:collapse;width:100%}
.gw th,.gw td{padding:12px 8px;text-align:center;white-space:nowrap;font-size:13px;border-bottom:1px solid var(--bd)}
.gw th:first-child,.gw td:first-child{position:sticky;left:0;background:var(--sf);text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;z-index:1;padding-left:16px;border-top-left-radius:12px;border-bottom-left-radius:12px}
.gw thead th{color:var(--mu);font-size:12px;font-weight:500}
.gw tbody tr:last-child td{border-bottom:0}
.cl{width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);cursor:pointer;font-weight:600;transition:.2s}
.cl.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cl.part{background:#ffcc00;border-color:#ffcc00;color:#fff}
.cl:disabled{cursor:default;opacity:.7}
#mod{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#mod.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:slideUp .3s cubic-bezier(.16,1,.3,1);max-height:90vh;overflow:auto}
@keyframes slideUp{from{transform:translateY(100%)}}
.sheet p{margin:8px 0 20px}
@media(min-width:600px){#mod{align-items:center}.sheet{border-radius:24px}}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 24px;border-radius:100px;opacity:0;transition:.3s;z-index:60;font-weight:500;font-size:13px;max-width:90vw;pointer-events:none;text-align:center;box-shadow:var(--sh-lg)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.er{background:var(--er);color:#fff}
#toast.info{background:var(--pri);color:#fff}
#splash,#wel{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;background:var(--bg);color:var(--tx);transition:transform .5s,opacity .4s}
#splash.out{transform:translateY(-100%);opacity:0}
#wel{opacity:0;pointer-events:none}#wel.on{opacity:1;pointer-events:auto}
#splash h1{font-size:40px;font-weight:700;color:var(--tx);margin-top:20px;letter-spacing:-1px}
#splash p{margin:0;color:var(--mu);font-weight:400}
.bar{width:160px;height:4px;background:var(--sf);border-radius:4px;overflow:hidden;margin-top:20px}
.bar i{display:block;height:100%;width:0;background:var(--pri);animation:ld 1.5s .3s forwards}
@keyframes ld{to{width:100%}}
.chart{display:flex;gap:12px;align-items:flex-end;height:160px;margin:24px 0 12px;padding:0 8px}
.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:8px}
.bs{display:flex;gap:4px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.bs i{width:45%;max-width:20px;min-height:4px;border-radius:6px 6px 2px 2px;transform-origin:bottom;animation:gr .6s cubic-bezier(.16,1,.3,1) both}
@keyframes gr{from{transform:scaleY(0)}}
.bi{background:var(--pri)}.bo{background:var(--mu)}
.lg2{display:flex;gap:16px;font-size:12px;font-weight:400;color:var(--mu);justify-content:center}
.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.tabs button{border:0;background:var(--sf);padding:8px 16px;font-weight:500;font-size:13px;color:var(--mu);cursor:pointer;transition:.2s;border-radius:100px}
.tabs button.on{background:var(--pri);color:#fff}

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.seg label { position: relative; cursor: pointer; display: block; }
.seg input[type="radio"] { display: none !important; }
.seg label span { display: block; text-align: center; padding: 14px 12px; border: 1.5px solid var(--bd); border-radius: 12px; background: var(--bg); font-weight: 600; font-size: 14px; color: var(--mu); transition: all 0.2s ease; }
.seg input[type="radio"]:checked + span { border-color: var(--pri) !important; background: var(--sf) !important; color: var(--pri) !important; box-shadow: 0 0 0 2px var(--pri-l); }
.seg input[type="radio"]:checked + span::before { content: "✓"; margin-right: 6px; font-weight: bold; }

.set-menu { border-radius: 16px; overflow: hidden; background: var(--sf); }
.set-item { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--bd); cursor: pointer; transition: background 0.2s; }
.set-item:last-child { border-bottom: none; }
.set-item:active { background: var(--bd); }
.set-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.set-icon.blue { background: #e0f0ff; color: #007aff; }
.set-icon.red { background: #ffebea; color: #ff3b30; }
.set-icon.purple { background: #f5e6ff; color: #af52de; }
.set-icon.orange { background: #fff3e0; color: #ff9500; }
.set-icon.green { background: #e8f8ee; color: #34c759; }
html[data-theme="dark"] .set-icon.blue { background: rgba(0,122,255,0.2); }
html[data-theme="dark"] .set-icon.red { background: rgba(255,59,48,0.2); }
html[data-theme="dark"] .set-icon.purple { background: rgba(175,82,222,0.2); }
html[data-theme="dark"] .set-icon.orange { background: rgba(255,149,0,0.2); }
html[data-theme="dark"] .set-icon.green { background: rgba(52,199,89,0.2); }
@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) .set-icon.blue { background: rgba(0,122,255,0.2); }
  :root:not([data-theme="light"]) .set-icon.red { background: rgba(255,59,48,0.2); }
  :root:not([data-theme="light"]) .set-icon.purple { background: rgba(175,82,222,0.2); }
  :root:not([data-theme="light"]) .set-icon.orange { background: rgba(255,149,0,0.2); }
  :root:not([data-theme="light"]) .set-icon.green { background: rgba(52,199,89,0.2); }
}
.set-text { flex: 1; min-width: 0; }
.set-text b { display: block; font-size: 15px; font-weight: 500; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-text small { display: block; font-size: 12px; color: var(--mu); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-arrow { color: var(--mu); width: 18px; height: 18px; flex-shrink: 0; }
.set-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.set-header button { border: 0; background: transparent; color: var(--pri); font-weight: 600; font-size: 16px; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px; }
.set-header h2 { font-size: 20px; font-weight: 700; color: var(--tx); margin: 0; }

.rep-wrap{position:relative;margin:0 -20px;padding:0 20px}
.rep-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.rep-scroll::-webkit-scrollbar{height:6px}
.rep-scroll::-webkit-scrollbar-track{background:transparent}
.rep-scroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.rep-inner{min-width:560px;padding:4px 2px 8px}
.rep{font-family:'Inter',-apple-system,sans-serif;color:var(--tx);line-height:1.55;letter-spacing:-.01em}
.scroll-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--mu);margin:0 0 10px;font-weight:500;transition:opacity .3s}
.scroll-hint.gone{opacity:0}
.scroll-hint svg{width:14px;height:14px;animation:slideHint 1.6s ease-in-out infinite}
@keyframes slideHint{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.rep .rh{display:flex;align-items:flex-start;gap:16px;padding-bottom:18px;margin-bottom:24px;border-bottom:2px solid var(--tx)}
.rep .rh .rh-brand svg{display:block}
.rep .rh .rh-text{flex:1}
.rep .rh .rh-school{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--mu);font-weight:500;margin:0 0 4px}
.rep .rh .rh-title{font-size:20px;font-weight:600;color:var(--tx);margin:0;letter-spacing:-.4px;line-height:1.2}
.rep .rh .rh-sub{font-size:11.5px;color:var(--mu);margin:4px 0 0;font-weight:400}
.rep .rh .rh-meta{text-align:right;font-size:9.5px;color:var(--mu);line-height:1.65;flex-shrink:0;letter-spacing:.2px}
.rep .rh .rh-meta b{color:var(--tx);font-weight:500}
.rep .rhero{border:1px solid var(--bd);border-radius:12px;padding:18px 20px;margin-bottom:14px;background:var(--sf);display:flex;justify-content:space-between;align-items:center;gap:16px}
.rep .rhero .rhero-l{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);font-weight:500;margin:0 0 6px}
.rep .rhero .rhero-v{font-size:24px;font-weight:600;color:var(--tx);margin:0;letter-spacing:-.5px;line-height:1.1}
.rep .rhero .rhero-r{text-align:right;font-size:10.5px;color:var(--mu);line-height:1.7}
.rep .rhero .rhero-r b{color:var(--tx);font-weight:500}
.rep .rgrid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:28px}
.rep .rgrid .rcell{padding:16px 14px;border-right:1px solid var(--bd)}
.rep .rgrid .rcell:last-child{border-right:0}
.rep .rgrid .rcell-l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);font-weight:500;margin:0 0 6px}
.rep .rgrid .rcell-v{font-size:15px;font-weight:500;color:var(--tx);margin:0;letter-spacing:-.2px}
.rep .rgrid .rcell-v.pos{color:var(--ok)}.rep .rgrid .rcell-v.neg{color:var(--er)}
.rep .rsec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.3px;color:var(--mu);margin:0 0 12px}
.rep table{width:100%;border-collapse:collapse;margin:0 0 28px;font-size:12.5px}
.rep table thead th{text-align:left;padding:8px 0;font-size:9.5px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--tx);white-space:nowrap}
.rep table thead th:last-child{text-align:right}
.rep table tbody td{padding:11px 0;border-bottom:1px solid var(--bd);font-weight:400;color:var(--tx);vertical-align:middle}
.rep table tbody tr:last-child td{border-bottom:none}
.rep table tbody td:last-child{text-align:right}
.rep table .saldo-row td{border-top:1px solid var(--tx);border-bottom:none;padding-top:14px;padding-bottom:0;font-weight:500;color:var(--tx)}
.rep table .saldo-row td:first-child{font-weight:500;color:var(--mu);text-transform:uppercase;font-size:9.5px;letter-spacing:1px}
.rep .rprog{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.rep .rprog .rprog-track{flex:1;max-width:80px;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.rep .rprog .rprog-fill{height:100%;background:var(--tx);border-radius:2px}
.rep .rprog .rprog-text{font-size:10.5px;color:var(--mu);font-weight:400;min-width:40px;text-align:right;white-space:nowrap}
.rep .rstatus-lunas{color:var(--ok);font-weight:500;white-space:nowrap}
.rep .rstatus-tunggak{color:var(--er);font-weight:500;white-space:nowrap}
.rep .rfoot{margin-top:36px;padding-top:14px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--mu);line-height:1.6;gap:16px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

body.print-mode .rep{background:#fff!important;color:#111!important;padding:20px!important;width:190mm!important;margin:0 auto!important}
body.print-mode .rep .rh{border-bottom-color:#111!important}
body.print-mode .rep .rh-school{color:#666!important}
body.print-mode .rep .rh-title{color:#111!important;font-size:18px!important}
body.print-mode .rep .rh-sub{color:#555!important}
body.print-mode .rep .rh-meta{color:#555!important}
body.print-mode .rep .rh-meta b{color:#111!important}
body.print-mode .rep .rhero{background:#f7f7f7!important;border-color:#ccc!important}
body.print-mode .rep .rhero-l{color:#666!important}
body.print-mode .rep .rhero-v{color:#111!important}
body.print-mode .rep .rhero-r{color:#555!important}
body.print-mode .rep .rhero-r b{color:#111!important}
body.print-mode .rep .rgrid{border-color:#ccc!important}
body.print-mode .rep .rcell{border-right-color:#ccc!important}
body.print-mode .rep .rcell-l{color:#666!important}
body.print-mode .rep .rcell-v{color:#111!important}
body.print-mode .rep .rcell-v.pos,
body.print-mode .rep .rcell-v.neg{color:#111!important}
body.print-mode .rep .rsec{color:#444!important}
body.print-mode .rep table thead th{color:#555!important;border-bottom-color:#111!important}
body.print-mode .rep table tbody td{color:#111!important;border-bottom-color:#ddd!important}
body.print-mode .rep table .saldo-row td{border-top-color:#111!important;color:#111!important}
body.print-mode .rep .rprog-track{background:#ddd!important}
body.print-mode .rep .rprog-fill{background:#111!important}
body.print-mode .rep .rprog-text{color:#555!important}
body.print-mode .rep .rstatus-lunas,
body.print-mode .rep .rstatus-tunggak{color:#111!important}
body.print-mode .rep .rfoot{color:#777!important;border-top-color:#ccc!important}
body.print-mode .rep .rh-brand svg rect{fill:#111!important}
body.print-mode .rep .rh-brand svg path,
body.print-mode .rep .rh-brand svg circle{stroke:#fff!important;fill:#fff!important}

@media print {
  @page { size: A4 portrait; margin: 15mm; }

const $ = s => document.querySelector(s), mem = {};
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js = s => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/</g, '\\x3C');
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const DAY = 86400000;

const rd = (d) => {
  if (!d) return '-';
  let dateObj;
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) dateObj = new Date(d.replace(/-/g, '/'));
  else dateObj = new Date(d);
  if (isNaN(dateObj.getTime())) return '-';
  return dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
};

const ld = k => { try { const r = localStorage.getItem(k); if (r) return JSON.parse(r) } catch (e) {} return mem[k] || null };
const sv = (k, v) => { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };

const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9-]/g, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let C = null, S = { v: 'land' };

const addDaysLocal = (dateStr, days) => {
  if (!dateStr) return today();
  const d = new Date(dateStr.replace(/-/g, '/'));
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const nominalForWeek = (w) => {
  const snap = (C && C.nomSnap) || {};
  let found = null;
  for (const k in snap) if (+k <= w && (found === null || +k > +found)) found = k;
  return found !== null ? +snap[found] : +(C ? C.nominal : 0);
};

const payStatus = (val, nominal) => {
  if (!val) return 0;
  return (+val >= +nominal) ? 2 : 1;
};

const loginLock = { fails: 0, until: 0 };
const checkLoginLock = () => {
  if (Date.now() < loginLock.until) {
    const s = Math.ceil((loginLock.until - Date.now()) / 1000);
    throw new Error(`Terlalu banyak percobaan. Coba lagi dalam ${s} detik.`);
  }
};
const noteLoginFail = () => { loginLock.fails++; if (loginLock.fails >= 5) { loginLock.until = Date.now() + 30000; loginLock.fails = 0; } };
const noteLoginOk = () => { loginLock.fails = 0; loginLock.until = 0; };

const curWk = () => {
  if (!C || !C.start) return 0;
  const start = new Date(C.start.replace(/-/g, '/'));
  const now = new Date(today().replace(/-/g, '/'));
  const diffDays = Math.floor((now - start) / DAY);
  return Math.max(0, Math.floor(diffDays / 7));
};

const wkDate = (w) => rd(addDaysLocal(C.start, w * 7));
const save = () => { persistLocal(); push(); };

function persistLocal() {
  if (!C || !C.code) return;
  try { localStorage.setItem('kas:data:' + C.code, JSON.stringify(C)); } catch (e) {}
}

function toast(m, t) {
  const e = $('#toast');
  e.textContent = m;
  e.className = 'on ' + (t || '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.className = '', 2500);
}

const modal = (x, autoFocus = true) => {
  const m = $('#mod');
  m.innerHTML = '<div class="sheet" role="document">' + x + '</div>';
  m.setAttribute('role', 'dialog');
  m.setAttribute('aria-modal', 'true');
  m.classList.add('on');
  if (autoFocus) setTimeout(() => {
    const f = m.querySelector('input:not([type=hidden]), select, textarea, button');
    if (f && !f.hasAttribute('data-a')) f.focus();
  }, 50);
};
const closeM = () => {
  const m = $('#mod');
  m.classList.remove('on');
  m.removeAttribute('role');
  m.removeAttribute('aria-modal');
  m.innerHTML = '';
};

const ask = (m, fn, onCancel) => {
  A._y = fn; A._n = onCancel || null;
  modal(`<h3>Konfirmasi</h3><p class="mu">${m}</p><div class="g2"><button class="btn ghost" data-a="no">Batal</button><button class="btn red" data-a="yes">Ya, lanjutkan</button></div>`, false);
};

const ss = (id) => {
  const p = C.pay[id] || {};
  const t = curWk() + 1;
  let l = 0, part = 0, debt = 0;
  for (let w = 0; w < t; w++) {
    const nom = nominalForWeek(w);
    const val = +p[w] || 0;
    if (val >= nom) l++;
    else if (val > 0) { part++; debt += (nom - val); }
    else debt += nom;
  }
  return { l, part, u: t - l - part, t, debt, unpaidWeeks: t - l };
};

function st() {
  let p = 0;
  for (const s in C.pay) for (const w in C.pay[s]) p += +C.pay[s][w] || 0;
  const sm = t => C.tx.filter(x => x.t == t).reduce((a, x) => a + x.a, 0);
  const i = sm('in'), o = sm('out'), cw = curWk();
  let debt = 0, thisPaid = 0;
  C.students.forEach(s => {
    const z = ss(s.id);
    debt += z.debt;
    if (payStatus((C.pay[s.id] || {})[cw], nominalForWeek(cw)) === 2) thisPaid++;
  });
  return { p, i, o, saldo: p + i - o, n: C.students.length, debt, thisPaid };
}

};

function vChartM() {
  const m = {};
  const add = (d, k, a) => { const y = String(d).slice(0, 7); (m[y] = m[y] || { i: 0, o: 0 })[k] += a; };
  for (const s in C.pay) for (const w in C.pay[s]) add(addDaysLocal(C.start, +w * 7), 'i', +C.pay[s][w] || 0);
  C.tx.forEach(t => add(t.d, t.t == 'in' ? 'i' : 'o', t.a));
  const ks = Object.keys(m).sort().slice(-6);
  if (!ks.length) return '';
  const mx = Math.max(...ks.map(k => Math.max(m[k].i, m[k].o)), 1);
  return `<div class="card"><h3>Arus kas bulanan</h3><div class="chart">${ks.map(k => `<div class="bc"><div class="bs"><i class="bi" style="height:${m[k].i / mx * 100}%"></i><i class="bo" style="height:${m[k].o / mx * 100}%"></i></div><small>${new Date(k + '-01').toLocaleDateString('id-ID', { month: 'short' })}</small></div>`).join('')}</div><div class="lg2"><span><i class="bi"></i>Masuk</span><span><i class="bo"></i>Keluar</span></div></div>`;
}

function vChartW() {
  const cw = curWk(), n = C.students.length, ws = [];
  if (!n) return '';
  for (let w = Math.max(0, cw - 7); w <= cw; w++) {
    let a = 0; C.students.forEach(s => a += +((C.pay[s.id] || {})[w]) || 0);
    const startStr = addDaysLocal(C.start, w * 7), endStr = addDaysLocal(C.start, (w + 1) * 7);
    const out = C.tx.filter(t => t.t == 'out' && t.d >= startStr && t.d < endStr).reduce((s, t) => s + t.a, 0);
    ws.push([w, a, out]);
  }
  const tg = n * C.nominal, mx = Math.max(tg, ...ws.map(x => x[2]), 1);
  return `<div class="card"><h3>Arus Kas Mingguan</h3><small class="mu">Iuran masuk vs pengeluaran</small><div class="chart">${ws.map(([w, a, out]) => `<div class="bc w"><div class="bs"><i class="bi" style="height:${tg ? Math.max(2, a / tg * 100) : 2}%"></i><i class="bo" style="height:${mx ? Math.max(2, out / mx * 100) : 2}%"></i></div><small>M${w + 1}</small></div>`).join('')}</div><div class="lg2"><span><i class="bi"></i>Masuk</span><span><i class="bo"></i>Keluar</span></div></div>`;
}

function vChart() {
  const w = S.cm != 'm';

}

function vLap() {

            <div class="rcell"><p class="rcell-l">Total Pengeluaran</p><p class="rcell-v neg">${rp(s.o)}</p></div>
            <div class="rcell"><p class="rcell-l">Tunggakan Siswa</p><p class="rcell-v">${rp(s.debt)}</p></div>
          </div>
          <p class="rsec">Rekap Pengeluaran</p>
          <table><thead><tr><th>Kategori</th><th style="text-align:right">Jumlah</th></tr></thead><tbody>
            ${Object.keys(cats).length ? Object.keys(cats).map(c => `<tr><td>${h(c)}</td><td>${rp(cats[c])}</td></tr>`).join('') : '<tr><td colspan="2" style="text-align:left;color:var(--mu)">Belum ada pengeluaran tercatat</td></tr>'}
            ${Object.keys(cats).length ? `<tr class="saldo-row"><td>Total pengeluaran</td><td>${rp(s.o)}</td></tr>` : ''}

            ${C.students.map(x => {
              const z = ss(x.id);

              return `<tr><td>${h(x.n)}</td><td><div class="rprog"><div class="rprog-track"><div class="rprog-fill" style="width:${pct}%"></div></div><span class="rprog-text">${z.l}/${z.t}</span></div></td><td>${z.debt ? `<span class="rstatus-tunggak">${rp(z.debt)}</span>` : `<span class="rstatus-lunas">Lunas</span>`}</td></tr>`;

function setRoleTheme(r) { document.documentElement.dataset.role = r || ''; }

function render(an = true) {
  const y = scrollY, g = $('#gw'), sl = g && g.scrollLeft, r = $('#root');
  if (!C) {
    r.innerHTML = (S.v == 'login' ? vLogin : S.v == 'reg' ? vReg : S.v == 'forgot' ? vForgot : S.v == 'forgot_admin' ? vForgotAdmin : vLand)();
    setRoleTheme(S.r);
  } else {
    r.innerHTML = hdr() + `<main class="view ${an ? 'an' : ''}">` + V[S.tab]() + '</main>' + nav();
    setRoleTheme(S.role);
  }
  if (an) document.querySelectorAll('[data-n]').forEach(cu);
  const n = $('#gw');
  if (n) n.scrollLeft = (sl == null || an) ? n.scrollWidth : sl;
  if (C && S.tab === 'lap') setupRepScroll();
  if (an) scrollTo(0, 0); else scrollTo(0, y);
}

function setupRepScroll() {
  const sc = $('#rep-scroll'), hint = $('#scroll-hint');
  if (!sc || !hint) return;
  const update = () => {
    const canScroll = sc.scrollWidth > sc.clientWidth + 2;
    const atEnd = sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 4;
    hint.classList.toggle('gone', !canScroll || atEnd);
  };
  if (window.innerWidth >= 640) hint.classList.add('gone');
  sc.addEventListener('scroll', update, { passive: true, once: true });
  setTimeout(update, 100);
}

function applySearch(val) {
  S.fq = val;
  const v = val.toLowerCase();
  if (S.tab === 'tx') {
    document.querySelectorAll('#tx-list .row').forEach(r => { r.style.display = r.textContent.toLowerCase().includes(v) ? '' : 'none'; });
  } else if (S.tab === 'iuran') {
    document.querySelectorAll('#gw tbody tr').forEach(r => { r.style.display = r.firstChild.textContent.toLowerCase().includes(v) ? '' : 'none'; });
  }
}

function enter() {
  C.nomSnap = C.nomSnap || { 0: +C.nominal || 0 };
  render();
  $('#wt').textContent = 'Selamat datang';
  $('#ws').textContent = RL[S.role] + ' · ' + C.name;
  const w = $('#wel');
  w.classList.add('on');
  setTimeout(() => w.classList.remove('on'), 1600);
}

const A = {

  home() { S.v = 'land'; render(); },
  login(d) { S = { v: 'login', r: d.r }; render(); },
  forgot() { S.v = 'forgot'; render(); },

  tab(d) {

  logout() { ask('Apakah Anda yakin ingin keluar dari akun ini?', () => { C = null; S = { v: 'land' }; closeM(); render(); }); },
  listcls() {
    modal(`<h3>Daftar Kelas Terdaftar</h3><p class="mu">Pilih kelas di bawah ini untuk mengisi kode kelas secara otomatis, atau klik ikon untuk mengedit/menghapus.</p><div id="cls-list" style="max-height:50vh;overflow:auto;"><p class="mu" style="text-align:center;padding:20px 0">Memuat data...</p></div><button class="btn ghost full" style="margin-top:16px" data-a="no">Tutup</button>`);
    rpc('kk_list_classes').then(data => {
      const list = document.getElementById('cls-list');
      if (!list) return;
      if (!data || !data.length) { list.innerHTML = '<p class="mu" style="text-align:center;padding:20px 0">Belum ada kelas terdaftar di server.</p>'; return; }
      const grouped = {};
      data.forEach(c => { const sch = c.school || 'Tanpa Sekolah'; if (!grouped[sch]) grouped[sch] = []; grouped[sch].push(c); });
      let html = '';
      for (const sch in grouped) {
        html += `<div style="margin-bottom:16px"><b style="display:block;font-size:13px;color:var(--mu);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;font-weight:500">${h(sch)}</b>`;
        grouped[sch].forEach(c => {
          html += `<div class="row" style="padding:12px 0; border-bottom:1px solid var(--bd)"><div class="m" style="cursor:pointer" onclick="A.fill_code('${js(c.code)}')"><b>${h(c.name)}</b><small>${h(c.code)}</small></div><button class="ib" style="color:var(--pri)" onclick="A.editcls('${js(c.code)}', '${js(c.name)}', '${js(c.school)}')" aria-label="Edit kelas">${ic('edit')}</button><button class="ib" style="color:var(--er)" onclick="A.delcls('${js(c.code)}', '${js(c.name)}')" aria-label="Hapus kelas">${ic('trash')}</button><button class="btn sm pri" onclick="A.fill_code('${js(c.code)}')">Pilih</button></div>`;
        });
        html += `</div>`;
      }
      list.innerHTML = html;
    }).catch(err => {
      const list = document.getElementById('cls-list');
      if (!list) return;
      let localHtml = `<div style="text-align:center; padding:12px; background:var(--erb); color:var(--er); border-radius:12px; font-size:12px; margin-bottom:16px"><b>⚠️ Server Offline</b><br><span style="opacity:0.8">Menampilkan data yang tersimpan di HP ini.</span><button class="btn sm" style="margin-top:8px; background:#fff; color:var(--er); border:1px solid var(--erb); width:100%" onclick="A.listcls()">Coba Lagi</button></div>`;
      let found = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('kas:data:')) {
          try {
            const c = JSON.parse(localStorage.getItem(key));
            if (c && c.code) {
              localHtml += `<div class="row" style="padding:12px 0; border-bottom:1px solid var(--bd)"><div class="m" style="cursor:pointer" onclick="A.fill_code('${js(c.code)}')"><b>${h(c.name)}</b><small>${h(c.school)} · ${h(c.code)}</small></div><button class="btn sm pri" onclick="A.fill_code('${js(c.code)}')">Pilih</button></div>`;
              found++;
            }
          } catch(e) {}
        }
      }
      list.innerHTML = found > 0 ? localHtml : `<p class="pos" style="text-align:center;padding:20px 0;color:var(--er)">Gagal memuat: ${h(err.message)}<br><br>Belum ada data kelas yang tersimpan di HP ini.</p>`;
    });
  },
  fill_code(c) { 
    closeM(); 
    // Jangan timpa seluruh object S, cukup ubah view-nya saja
    S.v = 'login'; 
    render(); 
    
    // Beri jeda agar animasi render selesai
    setTimeout(() => { 
      const inp = document.getElementById('login-code'); 
      if (inp) {
        inp.value = c; 
        // Beri trigger event agar validasi (jika ada) berjalan
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        inp.dispatchEvent(new Event('change', { bubbles: true }));
        
        // Pindahkan fokus ke kolom PIN
        const pinInp = document.getElementById('login-pin');
        if (pinInp) pinInp.focus();
      }
    }, 350); 
  },
  delcls(c, n) { closeM(); modal(`<h3>Hapus Kelas</h3><p class="mu">Kelas <b>${h(n)} (${h(c)})</b> akan dihapus permanen. Masukkan PIN Bendahara untuk melanjutkan.</p><form data-f="delcls"><input type="hidden" name="code" value="${h(c)}"><label class="f"><span>PIN Bendahara</span><input name="pin" type="password" inputmode="numeric" maxlength="8" required autofocus></label><button class="btn red full" style="margin-top:8px">Hapus Kelas</button></form>`); },
  editcls(c, n, s) { closeM(); modal(`<h3>Edit Info Kelas</h3><p class="mu">Ubah nama kelas atau sekolah. Masukkan PIN Bendahara untuk menyimpan perubahan.</p><form data-f="editcls"><input type="hidden" name="code" value="${h(c)}"><label class="f"><span>Nama Kelas</span><input name="name" value="${h(n)}" required maxlength="30"></label><label class="f"><span>Nama Sekolah</span><input name="school" value="${h(s)}" required maxlength="50"></label><label class="f"><span>PIN Bendahara (Verifikasi)</span><input name="pin" type="password" inputmode="numeric" maxlength="8" required autofocus placeholder="••••"></label><button class="btn full pri" style="margin-top:8px">Simpan Perubahan</button></form>`); },
  pay(d) {
    const sid = d.s, w = +d.w, p = C.pay[sid] = C.pay[sid] || {}, nom = nominalForWeek(w);
    if (p[w]) { ask('Hapus pembayaran minggu ini?', () => { delete p[w]; save(); render(false); }); return; }

  },
  all() { ask('Tandai semua siswa lunas untuk minggu ini?', () => { const w = curWk(), nom = nominalForWeek(w); C.students.forEach(s => { const p = C.pay[s.id] = C.pay[s.id] || {}; if ((+p[w]||0) < nom) p[w] = nom; }); save(); render(false); toast('Semua siswa ditandai lunas'); }); },
  atx() { modal(`<h3>Catat transaksi</h3><form data-f="tx"><div class="seg"><label><input type="radio" name="t" value="out" checked><span>Pengeluaran</span></label><label><input type="radio" name="t" value="in"><span>Pemasukan</span></label></div><label class="f"><span>Jumlah (Rp)</span><input name="a" type="number" min="1" required></label><label class="f"><span>Kategori</span><select name="c">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label><label class="f"><span>Keterangan</span><input name="note" required maxlength="60" placeholder="mis. Beli spidol"></label><label class="f"><span>Tanggal</span><input name="d" type="date" value="${today()}" required></label><button class="btn full pri" style="margin-top:8px">Simpan</button></form>`); },
  btx() { modal(`<h3>Catat Banyak Transaksi</h3><p class="mu">Format: Tanggal | jenis(in/out) | Nominal | Keterangan. Satu baris satu transaksi.</p><form data-f="btx"><label class="f"><textarea name="n" rows="6" required placeholder="2023-10-25 | out | 15000 | Beli sapu&#10;in | 50000 | Donasi orang tua"></textarea></label><button class="btn full pri" style="margin-top:8px">Simpan Semua</button></form>`); },
  etx(d) { const t = C.tx.find(x => x.id == d.id) || { t: 'out', d: today(), note: '', a: '', c: '' }; modal(`<h3>Ubah transaksi</h3><form data-f="tx"><input type="hidden" name="id" value="${h(d.id)}"><div class="seg"><label><input type="radio" name="t" value="out" ${t.t == 'out' ? 'checked' : ''}><span>Pengeluaran</span></label><label><input type="radio" name="t" value="in" ${t.t == 'in' ? 'checked' : ''}><span>Pemasukan</span></label></div><label class="f"><span>Jumlah (Rp)</span><input name="a" type="number" min="1" required value="${t.a}"></label><label class="f"><span>Kategori</span><select name="c">${CATS.map(c => `<option ${c == t.c ? 'selected' : ''}>${c}</option>`).join('')}</select></label><label class="f"><span>Keterangan</span><input name="note" required maxlength="60" value="${h(t.note)}"></label><label class="f"><span>Tanggal</span><input name="d" type="date" value="${t.d}" required></label><button class="btn full pri" style="margin-top:8px">Simpan Perubahan</button></form>`); },

    const opt = {
      margin:       [10, 10, 10, 10],

}

async function rpc(fn, a) {
  let r;
  try {
    const controller = new AbortController(), timeoutId = setTimeout(() => controller.abort(), 8000);
    r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(a), signal: controller.signal });
    clearTimeout(timeoutId);
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Waktu koneksi habis (Timeout). Periksa koneksi internet Anda.');
    throw new Error('Gagal terhubung ke server. Pastikan internet stabil atau jalankan via HTTPS.');
  }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) ? j.message : 'Gagal terhubung ke server (CORS/Blocked)');
  if (j && j.error) throw new Error(j.error);
  return j;
}

let pt, busy = 0, dirty = 0;

function updateSyncUI(state) {
  const el = $('#sync-status');
  if (!el) return;
  el.innerHTML = '';
  if (state === 'saving') { el.innerHTML = ic('cloud'); el.style.background = 'var(--pri-l)'; el.style.color = 'var(--pri)'; }
  else if (state === 'error') { el.innerHTML = ic('cloud'); el.style.background = 'var(--erb)'; el.style.color = 'var(--er)'; }
  else { el.innerHTML = ic('check'); el.style.background = 'var(--okb)'; el.style.color = 'var(--ok)'; }
}

function push() {
  if (S.role != 'b') return;
  // Jika offline atau token tidak ada, simpan lokal saja
  if (!S.tok || S.tok === 'offline') { updateSyncUI('ok'); persistLocal(); return; }
  
  dirty = 1; updateSyncUI('saving');
  clearTimeout(pt);
  pt = setTimeout(async () => {
    if (busy) { push(); return; }
    busy = 1;
    try {
      const d = { ...C }; delete d.code; delete d.rec_code;
      const res = await rpc('kk_save', { p_token: S.tok, p_data: d, p_ver: S.ver });
      if (res.error) throw new Error(res.error);
      S.ver = res.ver; updateSyncUI('ok'); persistLocal(); dirty = 0;
    } catch (e) { 
      // PERBAIKAN: Jika error karena sesi habis, paksa logout
      if (/sesi/i.test(e.message)) {
        updateSyncUI('error');
        toast('Sesi Anda berakhir. Silakan login ulang.', 'er');
        setTimeout(() => A.logout(), 1500);
      } else {
        toast(e.message, 'er'); 
        updateSyncUI('error'); 
        dirty = 1; 
      }
    }
    busy = 0;
  }, 350);
}

async function pull(f) {
  if (!S.tok || S.tok === 'offline') return;
  try {
    const r = await rpc('kk_get', { p_token: S.tok });
    if (f || r.ver != S.ver) {
      S.ver = r.ver;
      C = { ...r.data, code: C.code, nominal: +r.data.nominal || 0, rec_code: C.rec_code, nomSnap: r.data.nomSnap || C.nomSnap || {} };
      persistLocal(); render(false);
    }
  } catch (e) { if (/sesi/i.test(e.message)) { A.logout(); toast('Sesi berakhir, silakan masuk lagi', 'er'); } }
}

setInterval(() => { if (C && S.tok && !dirty && !busy && !$('#mod').classList.contains('on')) pull(); }, 20000);

/* ---------- Restore Logic ---------- */
function restore(t) {
  const f = t.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.code || !d.school || !d.students) throw 0;
      
      ask('Pulihkan data ini? Data kelas dengan kode ' + d.code + ' akan ditimpa.', async () => {
        toast('Memulihkan data...');
        try {
          d.nominal = +d.nominal || 0; 
          d.nomSnap = d.nomSnap || { 0: d.nominal };
          
          // 1. Set data ke memori lokal
          C = d; 
          persistLocal(); 
          
          // 2. Cek apakah sedang login sebagai bendahara
          if (S.role === 'b' && S.tok && S.tok !== 'offline') {
            // Jika punya token asli, paksa upload data restore ke server
            const payload = { ...C }; 
            delete payload.code; 
            delete payload.rec_code;
            
            const res = await rpc('kk_save', { p_token: S.tok, p_data: payload, p_ver: S.ver });
            if (res.error) throw new Error(res.error);
            
            S.ver = res.ver;
            toast('Data berhasil dipulihkan & disinkronkan ke server');
          } else {
            // Jika offline (tidak punya token), paksa login manual untuk sinkronisasi
            toast('Data dipulihkan secara lokal. Harap login ulang untuk sinkronisasi.', 'info');
            setTimeout(() => {
              C = null; S = { v: 'land' }; render();
            }, 2500);
            return;
          }
          
          S.tab = 'home'; 
          render(false); 
        } catch (e) { 
          toast('Gagal memulihkan: ' + e.message, 'er'); 
        }
      });
    } catch (x) { toast('File tidak valid', 'er'); }
  };
  r.readAsText(f); t.value = '';
}

  F[f.dataset.f] && F[f.dataset.f](Object.fromEntries(new FormData(f)));
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.c == 'me') { S.me = t.value; render(false); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#mod').classList.contains('on')) closeM(); });

/* Back Button Handler */
history.pushState({ trap: true }, '', location.href);
window.addEventListener('popstate', function (e) {
  history.pushState({ trap: true }, '', location.href);

  if ($('#mod').classList.contains('on')) { 
    closeM(); 
    return; 
  }

  if (S.tab && S.tab.startsWith('set_')) {
    S.tab = 'set';
    render();
    return;
  }

  if (C) {
    ask('Apakah Anda yakin ingin keluar dari akun ini?', () => {
      C = null; 
      S = { v: 'land' }; 
      closeM(); 
      render();
    }, () => {});
    return;
  }

  if (S.v !== 'land') { 
    S.v = 'land'; 
    render(); 
    return; 
  }

  history.back();
});

const cu = el => {
  const n = +el.dataset.n, t0 = performance.now();
  const f = t => { const p = Math.min(1, (t - t0) / 900); el.textContent = rp(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Gagal:', err)); });
}

const th = ld('kas:theme'); if (th) document.documentElement.dataset.theme = th;
render();

if (!C && S.v == 'login') {
  setTimeout(async () => {
    const el = document.getElementById('login-code'); if (!el) return;
    el.value = '';
    const savedCode = ld('kas:last_code');
    if (savedCode) {
      try {
        const list = await rpc('kk_list_classes');
        if (list && Array.isArray(list)) {
          const exists = list.some(c => c.code === savedCode);
          if (exists) el.value = savedCode;
          else localStorage.removeItem('kas:last_code');
        }
      } catch (e) {}
    }
  }, 150);
}

setTimeout(() => { const s = $('#splash'); s.classList.add('out'); setTimeout(() => s.remove(), 900); }, 2500);
</script>
